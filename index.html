<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>リュウキ 今日の演習</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#202124;--muted:#6b7280;--line:#dfe3ea;--ok:#137333;--ng:#b3261e;--garden:#eef8ed}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}h1{font-size:28px;margin:10px 0 6px}.sub{color:var(--muted);margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,.05)}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
button{font:inherit;border:0;border-radius:14px;padding:14px 16px;cursor:pointer}.subject{background:#fff;border:1px solid var(--line);font-size:20px;font-weight:700;min-height:78px}
.primary{background:#202124;color:#fff;width:100%;font-weight:700}.choice{width:100%;background:#fff;border:1px solid var(--line);text-align:left;margin:7px 0}
input[type=text]{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;font-size:18px;margin:10px 0}
.topline{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:12px}.progress{height:8px;background:#e8ebef;border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar{height:100%;background:#202124;width:0}.q{font-size:22px;line-height:1.55;white-space:pre-wrap;margin-bottom:14px}.feedback{margin-top:16px;padding:14px;border-radius:12px;display:none;line-height:1.6}
.ok{background:#e8f5e9;color:var(--ok);display:block}.ng{background:#fce8e6;color:var(--ng);display:block}.hint{margin-top:10px;color:#7a4d00;background:#fff4d6;padding:10px 12px;border-radius:10px}
.explain{color:#374151;margin-top:7px}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1}.secondary{background:#fff;border:1px solid var(--line)}
.result{text-align:center}.score{font-size:46px;font-weight:800;margin:12px 0}.copybox{white-space:pre-wrap;background:#f7f7f8;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;margin-top:16px;font-size:14px}
.small{font-size:13px;color:var(--muted)}
.garden{background:linear-gradient(180deg,#f7fff5 0%,var(--garden) 100%);margin-bottom:16px}.garden-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.garden-title b{font-size:19px}
.garden-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.plant{background:#fff;border:1px solid #d8ead5;border-radius:15px;padding:12px 8px;text-align:center}
.plant-icon{font-size:46px;line-height:1.1;min-height:52px;display:flex;align-items:center;justify-content:center}.plant-name{font-weight:800;margin-top:7px}.plant-sub{font-size:12px;color:var(--muted);margin-top:4px;min-height:30px}
.growbar{height:7px;background:#e7eee5;border-radius:99px;overflow:hidden;margin-top:8px}.growfill{height:100%;background:#4f8a45}.growth-result{margin:16px 0 4px;padding:14px;border-radius:14px;background:#f1f8e9;border:1px solid #d7e8cc;line-height:1.55}.growth-big{font-size:34px;margin-bottom:6px}
@media(max-width:520px){h1{font-size:24px}.q{font-size:20px}.subjects{grid-template-columns:1fr}.garden-grid{grid-template-columns:repeat(3,1fr)}.plant{padding:10px 5px}.plant-icon{font-size:40px}}
</style>
</head>
<body>
<div class="wrap">
<div id="home">
<h1>リュウキ 今日の演習</h1>
<div class="sub">科目を選んで、1問ずつ進めます。間違えた問題は最後にもう一度出ます。</div>
<div class="card garden">
<div class="garden-title"><b>🌱 リュウキの畑</b><span class="small">がんばった分だけ育つよ</span></div>
<div class="garden-grid">
<div class="plant"><div class="plant-icon" id="plant-social">🌰</div><div class="plant-name">社会</div><div class="plant-sub" id="plant-social-text"></div><div class="growbar"><div class="growfill" id="plant-social-bar"></div></div></div>
<div class="plant"><div class="plant-icon" id="plant-science">🌰</div><div class="plant-name">理科</div><div class="plant-sub" id="plant-science-text"></div><div class="growbar"><div class="growfill" id="plant-science-bar"></div></div></div>
<div class="plant"><div class="plant-icon" id="plant-year">🌰</div><div class="plant-name">年号</div><div class="plant-sub" id="plant-year-text"></div><div class="growbar"><div class="growfill" id="plant-year-bar"></div></div></div>
</div>
<div class="small" style="margin-top:12px">60点以上で成長ポイント獲得。満点なら大きく成長します。記録はこの端末に保存されます。</div>
</div>
<div class="subjects">
<button class="subject" onclick="start('social')">社会</button>
<button class="subject" onclick="start('science')">理科</button>
<button class="subject" onclick="startYear()" style="grid-column:1 / -1">年号5分特訓</button>
</div>
<div class="card"><b>使い方</b><p>① 科目を選ぶ → ② 答える → ③ 間違えたらヒント → ④ 最後に間違いだけ再テスト。</p><p class="small">ログイン不要。結果と畑の成長はこの端末内に保存されます。</p><button class="secondary" onclick="toggleScope()" style="width:100%;margin-top:10px">出題範囲を見る</button><div id="scopeBox" style="display:none;margin-top:14px"></div></div>
</div>
<div id="quiz" style="display:none"><div class="card">
<div class="topline"><span id="subjectName"></span><span id="counter"></span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="q" id="question"></div><div id="answerArea"></div><div id="feedback" class="feedback"></div>
<div class="actions"><button class="secondary" onclick="goHome()">やめる</button><button class="primary" id="nextBtn" onclick="nextQuestion()" style="display:none">次へ</button></div>
</div></div>
<div id="result" style="display:none"><div class="card result">
<h2>今日の結果</h2><div class="score" id="score"></div><div id="resultText"></div>
<div id="growthResult" class="growth-result" style="display:none"></div>
<button class="primary" id="retryBtn" onclick="retryMistakes()" style="margin-top:16px">間違えた問題だけもう一度</button>
<button class="secondary" onclick="goHome()" style="width:100%;margin-top:10px">科目選択へ戻る</button>
<div class="copybox" id="copybox"></div><button class="secondary" onclick="copyResult()" style="width:100%;margin-top:10px">結果をコピー</button>
</div></div></div>
<script src="scope.js"></script>
<script src="questions.js"></script>
<script>
const BANK=window.QUESTION_BANK;const SCOPE=window.STUDY_SCOPE||{};let subject="",list=[],idx=0,correct=0,mistakes=[],locked=false,isRetry=false;
const GARDEN_KEY="ryuki_garden_v1";
const PLANTS={social:{name:"社会",label:"ひまわり",stages:["🌰","🌱","🌿","🌼","🌻"]},science:{name:"理科",label:"トマト",stages:["🌰","🌱","🌿","🌼","🍅"]},year:{name:"年号",label:"にんじん",stages:["🌰","🌱","🌿","🥕","🥕✨"]}};
function loadGarden(){try{const d=JSON.parse(localStorage.getItem(GARDEN_KEY)||"{}");return{social:Number(d.social)||0,science:Number(d.science)||0,year:Number(d.year)||0}}catch(e){return{social:0,science:0,year:0}}}
function saveGarden(d){try{localStorage.setItem(GARDEN_KEY,JSON.stringify(d))}catch(e){}}
function growthStage(points){if(points>=16)return 4;if(points>=12)return 3;if(points>=8)return 2;if(points>=4)return 1;return 0}
function renderGarden(){const d=loadGarden();Object.keys(PLANTS).forEach(function(k){const p=PLANTS[k],pts=d[k],stage=growthStage(pts);document.getElementById("plant-"+k).textContent=p.stages[stage];document.getElementById("plant-"+k+"-text").textContent=p.label+"・"+(stage>=4?"そだちきった！":pts+"/16 pt");document.getElementById("plant-"+k+"-bar").style.width=Math.min(100,pts/16*100)+"%"})}
function pointsForScore(firstTry,total){const pct=total?Math.round(firstTry/total*100):0;if(pct===100)return 4;if(pct>=80)return 3;if(pct>=60)return 2;return 0}
function awardGrowth(firstTry,total){const add=pointsForScore(firstTry,total),d=loadGarden(),p=PLANTS[subject];if(!p||add===0)return{add:0,icon:p?p.stages[growthStage(d[subject]||0)]:"🌱",text:"60点以上で植物が成長するよ。次は成長をめざそう！"};const before=growthStage(d[subject]||0);d[subject]=Math.min(16,(d[subject]||0)+add);saveGarden(d);const after=growthStage(d[subject]);const grew=after>before,done=after===4;return{add:add,icon:p.stages[after],text:done?p.label+"がそだちきった！ おめでとう！":(grew?p.label+"がひとつ成長した！":p.label+"に成長ポイント +"+add+"！")}}
function norm(s){return(s||"").trim().replace(/\s+/g,"").toLowerCase()}
function toggleScope(){const box=document.getElementById("scopeBox");if(box.style.display==="none"){const parts=["social","science"].map(function(k){const s=SCOPE[k]||{};const core=(s.core||[]).map(function(x){return"<li>"+x+"</li>"}).join("");const focus=(s.focus||[]).map(function(x){return"<li>"+x+"</li>"}).join("");const added=s.added||[];const addedHtml=added.length?added.map(function(x){return"<li>"+x+"</li>"}).join(""):"<li>追加教材なし</li>";return'<div style="margin-bottom:16px"><b>'+(s.title||k)+'</b><div class="small" style="margin-top:6px">基本範囲</div><ul style="margin-top:4px">'+core+'</ul><div class="small">重点</div><ul style="margin-top:4px">'+focus+'</ul><div class="small">追加教材</div><ul style="margin-top:4px">'+addedHtml+"</ul></div>"}).join("");box.innerHTML='<div class="small" style="margin-bottom:10px">更新日：'+(SCOPE.updated||"")+"</div>"+parts;box.style.display="block"}else box.style.display="none"}
function start(s){subject=s;list=[...BANK[s]];idx=0;correct=0;mistakes=[];isRetry=false;home.style.display="none";result.style.display="none";quiz.style.display="block";subjectName.textContent=s==="social"?"社会":"理科";render()}
function startYear(){subject="year";const pool=[...(BANK.year||[])];const today=new Date();let seed=Number(String(today.getFullYear())+String(today.getMonth()+1).padStart(2,"0")+String(today.getDate()).padStart(2,"0"));for(let i=pool.length-1;i>0;i--){seed=(seed*9301+49297)%233280;const j=Math.floor((seed/233280)*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}list=pool.slice(0,5);idx=0;correct=0;mistakes=[];isRetry=false;home.style.display="none";result.style.display="none";quiz.style.display="block";subjectName.textContent="年号5分特訓";render()}
function render(){locked=false;const q=list[idx];counter.textContent=(idx+1)+" / "+list.length;bar.style.width=(idx/list.length*100)+"%";question.textContent=q.q;feedback.className="feedback";feedback.innerHTML="";nextBtn.style.display="none";answerArea.innerHTML="";if(q.type==="choice"){q.choices.forEach(function(c){const b=document.createElement("button");b.className="choice";b.textContent=c;b.onclick=function(){submit(c)};answerArea.appendChild(b)})}else{const i=document.createElement("input");i.type="text";i.id="textAnswer";i.placeholder="ここに答えを入力";i.addEventListener("keydown",function(e){if(e.key==="Enter")submit(i.value)});const b=document.createElement("button");b.className="primary";b.textContent="答える";b.onclick=function(){submit(i.value)};answerArea.appendChild(i);answerArea.appendChild(b);setTimeout(function(){i.focus()},100)}}
function isCorrect(q,v){return(q.accepted||[q.answer]).map(norm).includes(norm(v))}
function submit(v){if(locked)return;const q=list[idx],ok=isCorrect(q,v);if(ok){locked=true;correct++;feedback.className="feedback ok";feedback.innerHTML='○ 正解！<div class="explain">'+q.explanation+"</div>";nextBtn.style.display="block"}else{if(!mistakes.includes(q))mistakes.push(q);feedback.className="feedback ng";feedback.innerHTML='× もう一度考えてみよう<div class="hint">ヒント：'+q.hint+"</div>"}}
function nextQuestion(){idx++;if(idx>=list.length)finish();else render()}
function finish(){quiz.style.display="none";result.style.display="block";const wrong=mistakes.length,firstTry=Math.max(0,list.length-wrong);score.textContent=firstTry+" / "+list.length;resultText.innerHTML=wrong===0?"全問正解です！":"最初に間違えた問題："+wrong+"問";retryBtn.style.display=wrong?"block":"none";const name=subject==="social"?"社会":subject==="science"?"理科":"年号5分特訓";let growText="";if(!isRetry){const g=awardGrowth(firstTry,list.length);growthResult.style.display="block";growthResult.innerHTML='<div class="growth-big">'+g.icon+"</div><b>"+g.text+"</b>"+(g.add?'<div class="small" style="margin-top:5px">今回の成長ポイント：+'+g.add+"</div>":"");growText="\n畑の成長："+g.text;renderGarden()}else{growthResult.style.display="none";growthResult.innerHTML=""}copybox.textContent="リュウキ 今日の"+name+"演習\n初回正解："+firstTry+"/"+list.length+"\n最初に間違えた問題："+wrong+"問"+growText+"\n間違えた内容：\n"+(mistakes.map(function(q,i){return(i+1)+". "+q.q.replace(/\n/g," ")}).join("\n")||"なし")}
function retryMistakes(){list=[...mistakes];idx=0;correct=0;mistakes=[];isRetry=true;result.style.display="none";quiz.style.display="block";render()}
function goHome(){quiz.style.display="none";result.style.display="none";home.style.display="block";renderGarden()}
async function copyResult(){try{await navigator.clipboard.writeText(copybox.textContent);alert("結果をコピーしました。")}catch(e){alert("コピーできない場合は結果欄を長押ししてください。")}}
renderGarden();
</script>
</body>
</html>
