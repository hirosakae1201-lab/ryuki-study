<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15243c"><title>リュウキ バトルアリーナ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b2d;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}button{font:inherit;border:0;border-radius:13px;padding:12px 17px;font-weight:800;background:#ffcf48;color:#17213b}button:disabled{opacity:.45}#game{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:max(8px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 3px #17213b}#top span{background:#17213bc9;padding:6px 10px;border-radius:10px}#controls{position:absolute;inset:0;pointer-events:none}#joy,#fire{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;background:#182b4b88;border:3px solid #ffffff88;pointer-events:auto;touch-action:none;display:grid;place-items:center}#joy{left:max(24px,env(safe-area-inset-left))}#fire{right:max(24px,env(safe-area-inset-right));background:#e35b4388}#knob{width:49px;height:49px;background:#b9d8ffbb;border-radius:50%}#fire span{font-size:30px}#super,#quizBtn{position:absolute;pointer-events:auto;right:155px;bottom:max(38px,env(safe-area-inset-bottom));width:70px;height:70px;border-radius:50%;padding:5px;background:#ffd348}#quizBtn{right:155px;bottom:115px;background:#65e0f1;font-size:12px}#super:disabled,#quizBtn:disabled{filter:grayscale(1)}#screen,#quizModal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#091528dd;padding:18px;z-index:5}#quizModal{z-index:7}#panel{max-width:470px;width:100%;max-height:94dvh;overflow:auto;border:2px solid #83a9e5;border-radius:22px;padding:22px;background:#20385d;text-align:center;box-shadow:0 16px 60px #0008}h1{font-size:clamp(22px,5vw,32px);margin:4px 0 10px}.muted{color:#cbdcf7;font-size:14px;line-height:1.6}.stats{background:#122747;border-radius:12px;padding:10px;margin:12px 0}#quizModal{display:none}#quizChoices{display:grid;gap:8px;margin-top:12px}#quizChoices button{background:#e7f2ff;text-align:left;font-size:15px}#quizFeedback{min-height:24px;margin:10px 0;font-size:14px}#quit{position:absolute;left:12px;top:48px;background:#233b5dbb;color:white;pointer-events:auto;padding:5px 10px;font-size:12px}#orientation{display:none;position:fixed;inset:0;z-index:9;background:#15243c;align-items:center;justify-content:center;text-align:center;padding:30px}#orientation button{margin-top:18px}@media(orientation:portrait){#orientation{display:flex}}@media(max-height:390px){#joy,#fire{width:88px;height:88px}#super{right:118px;bottom:22px;width:56px;height:56px}#quizBtn{right:118px;bottom:85px;width:56px;height:56px}#panel{padding:12px}h1{font-size:21px}}
</style></head><body>
<canvas id="game"></canvas><div id="hud"><div id="top"><span id="score">0 - 0</span><span id="clock">1:30</span><span id="charge">必殺 0%</span></div><button id="quit">終了</button><div id="controls"><div id="joy"><div id="knob"></div></div><div id="fire"><span>🎯</span></div><button id="super" disabled>⚡</button><button id="quizBtn" disabled>クイズ</button></div></div>
<div id="screen"><div id="panel"><h1 id="headline">⚔️ リュウキ バトルアリーナ</h1><div id="summary" class="muted">左スティックで移動、右スティックで狙って離すと攻撃。<br>クイズに正解すると必殺技がたまる！</div><div id="stats" class="stats"></div><button id="play">バトル開始</button><p class="muted"><a href="../" style="color:#a5dfff">いつもの学習画面へ戻る</a></p></div></div>
<div id="quizModal"><div id="panel"><h2>⚡ パワーアップクイズ</h2><div id="quizQuestion"></div><div id="quizChoices"></div><div id="quizFeedback"></div><button id="quizClose" style="display:none">バトルに戻る</button></div></div>
<div id="orientation"><div><h2>📱 スマホを横向きにしてね</h2><div class="muted">左右の親指で操作するゲームです。</div><button id="full">全画面を試す</button></div></div>
<script src="../scope.js"></script><script src="../questions.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),W=960,H=540;let scale=1,ox=0,oy=0;
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;scale=Math.min(canvas.width/W,canvas.height/H);ox=(canvas.width-W*scale)/2;oy=(canvas.height-H*scale)/2}addEventListener('resize',resize);resize();
const key='ryuki_arena_v1';function load(){try{return Object.assign({xp:0,coins:0,wins:0,games:0,correct:0,attempts:0},JSON.parse(localStorage.getItem(key)||'{}'))}catch{return {xp:0,coins:0,wins:0,games:0,correct:0,attempts:0}}}let profile=load();const save=()=>{try{localStorage.setItem(key,JSON.stringify(profile))}catch{}};
const blocks=[{x:365,y:120,w:68,h:125},{x:525,y:295,w:68,h:125},{x:425,y:255,w:110,h:30}];let player,enemy,bullets=[],particles=[],timer=90,ps=0,es=0,playing=false,paused=true,quizReady=false,quizCount=0,quizUsed=0,last=0,fireDir={x:1,y:0},fireHeld=false,fireTimer=0,move={x:0,y:0},superCharge=0,enemyTimer=0,respawn=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),norm=(x,y)=>{let d=Math.hypot(x,y);return d>0?{x:x/d,y:y/d}:{x:0,y:0}};
function stats(){$('stats').textContent='🏆 '+profile.wins+'勝　🪙 '+profile.coins+'　⭐ Lv.'+(1+Math.floor(profile.xp/100))+'　📘 '+profile.correct+'/'+profile.attempts+'問正解'}
function reset(){player={x:175,y:270,hp:100,dead:0};enemy={x:785,y:270,hp:100,dead:0};bullets=[];particles=[];timer=90;ps=0;es=0;quizCount=0;quizUsed=0;quizReady=false;superCharge=0;enemyTimer=0;fireTimer=0;respawn=0;move={x:0,y:0};fireHeld=false;playing=true;paused=false;$('screen').style.display='none';$('quizModal').style.display='none';updateHud()}
function collides(x,y,r=19){if(x<r+15||x>W-r-15||y<r+15||y>H-r-15)return true;return blocks.some(b=>x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)}
function walk(a,dx,dy,s){if(!collides(a.x+dx*s,a.y))a.x+=dx*s;if(!collides(a.x,a.y+dy*s))a.y+=dy*s}
function shoot(from,dir,damage=18,speed=480){if(from.dead>0)return;const d=norm(dir.x,dir.y);if(!d.x&&!d.y)return;bullets.push({x:from.x+d.x*24,y:from.y+d.y*24,vx:d.x*speed,vy:d.y*speed,from,damage,life:1.4})}
function hit(target,damage){if(target.dead>0)return;target.hp-=damage;if(target.hp<=0){target.dead=2;if(target===enemy){ps++;superCharge=clamp(superCharge+15,0,100)}else es++;updateHud();if(ps>=3||es>=3)end()}}
function updateHud(){$('score').textContent=ps+' - '+es;$('clock').textContent=Math.floor(timer/60)+':'+String(Math.floor(timer%60)).padStart(2,'0');$('charge').textContent='必殺 '+Math.floor(superCharge)+'%';$('super').disabled=superCharge<100||!playing||paused;$('quizBtn').disabled=!quizReady||paused||!playing}
function end(){if(!playing)return;playing=false;paused=true;const win=ps>es;profile.games++;if(win)profile.wins++;const coins=win?20:8,xp=win?35:15;profile.coins+=coins;profile.xp+=xp;save();$('headline').textContent=win?'🏆 勝利！':ps===es?'🤝 引き分け':'💪 次は勝とう！';$('summary').textContent='撃破 '+ps+' 対 '+es+'　獲得 🪙'+coins+' / ⭐'+xp+'XP';stats();$('play').textContent='もう一度バトル';$('screen').style.display='flex'}
function update(dt){if(!playing||paused)return;timer-=dt;if(timer<=0){timer=0;end();return}if(player.dead>0){player.dead-=dt;if(player.dead<=0){player.x=175;player.y=270;player.hp=100}}else walk(player,move.x,move.y,230*dt);
if(enemy.dead>0){enemy.dead-=dt;if(enemy.dead<=0){enemy.x=785;enemy.y=270;enemy.hp=100}}else if(player.dead<=0){let d=norm(player.x-enemy.x,player.y-enemy.y);if(dist(player,enemy)>220)walk(enemy,d.x,d.y,125*dt);else if(dist(player,enemy)<125)walk(enemy,-d.x,-d.y,100*dt);else walk(enemy,-d.y,d.x,48*dt);enemyTimer-=dt;if(enemyTimer<=0){shoot(enemy,d,12,330);enemyTimer=1.1+Math.random()*.6}}
fireTimer-=dt;if(fireHeld&&fireTimer<=0&&player.dead<=0){shoot(player,fireDir);fireTimer=.34}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;const target=b.from===player?enemy:player;if(b.life<=0||collides(b.x,b.y,6)){bullets.splice(i,1);continue}if(target.dead<=0&&Math.hypot(b.x-target.x,b.y-target.y)<25){hit(target,b.damage);bullets.splice(i,1)}}if(!quizReady&&quizCount<3&&timer<90-(quizCount+1)*23){quizReady=true}updateHud()}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#101b2d';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(scale,0,0,scale,ox,oy);ctx.fillStyle='#9bd780';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#86c56d';ctx.lineWidth=2;for(let x=20;x<W;x+=48)for(let y=20;y<H;y+=48){ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.stroke()}
for(const b of blocks){ctx.fillStyle='#9a7052';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle='#5b453a';ctx.lineWidth=5;ctx.strokeRect(b.x,b.y,b.w,b.h)}
function actor(a,color,label){if(a.dead>0)return;ctx.fillStyle='#14253b77';ctx.beginPath();ctx.ellipse(a.x,a.y+15,23,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.arc(a.x,a.y,20,0,Math.PI*2);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#17213b';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(label,a.x,a.y-35);ctx.fillStyle='#233';ctx.fillRect(a.x-25,a.y-30,50,6);ctx.fillStyle=a===player?'#28e484':'#ff776c';ctx.fillRect(a.x-25,a.y-30,50*Math.max(0,a.hp)/100,6)}
actor(player,'#327cf0','リュウキ');actor(enemy,'#ed615c','CPU');for(const b of bullets){ctx.fillStyle=b.from===player?'#fff05a':'#d33b8a';ctx.beginPath();ctx.arc(b.x,b.y,7,0,Math.PI*2);ctx.fill()}
if(!playing){ctx.fillStyle='#0002';ctx.fillRect(0,0,W,H)}}
function loop(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function bindStick(id,callback,knob){const el=$(id);let pid=null;function set(e){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(e.clientX-cx)/(r.width*.32),dy=(e.clientY-cy)/(r.height*.32);const l=Math.max(1,Math.hypot(dx,dy));dx/=l;dy/=l;callback(dx,dy,true);if(knob)knob.style.transform='translate('+dx*25+'px,'+dy*25+'px)'}el.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;el.setPointerCapture(pid);set(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===pid)set(e)});function stop(e){if(e.pointerId!==pid)return;pid=null;callback(0,0,false);if(knob)knob.style.transform=''}el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop)}
bindStick('joy',(x,y)=>{move={x,y}},$('knob'));bindStick('fire',(x,y,on)=>{if(on){if(Math.hypot(x,y)>.12)fireDir=norm(x,y);fireHeld=true}else{if(playing&&!paused&&fireTimer<=0){shoot(player,fireDir);fireTimer=.34}fireHeld=false}},null);
$('super').onclick=()=>{if(superCharge<100||!playing||paused)return;superCharge=0;const d=norm(enemy.x-player.x,enemy.y-player.y);for(let i=-2;i<=2;i++){let angle=Math.atan2(d.y,d.x)+i*.16;shoot(player,{x:Math.cos(angle),y:Math.sin(angle)},35,600)}updateHud()};
const bank=()=>{const b=window.QUESTION_BANK||{};return [...(b.social||[]),...(b.year||[])].filter(q=>q.type==='choice'&&q.choices&&q.choices.length>=3&&q.choices.includes(q.answer))};let current=null;
$('quizBtn').onclick=()=>{if(!quizReady||paused)return;const pool=bank();if(!pool.length){quizReady=false;return}current=pool[Math.floor(Math.random()*pool.length)];paused=true;quizReady=false;quizCount++;$('quizQuestion').textContent=current.q;$('quizChoices').replaceChildren();$('quizFeedback').textContent='';$('quizClose').style.display='none';current.choices.forEach(choice=>{let b=document.createElement('button');b.textContent=choice;b.onclick=()=>{const ok=choice===current.answer;profile.attempts++;if(ok){profile.correct++;superCharge=clamp(superCharge+50,0,100)}save();$('quizFeedback').textContent=(ok?'正解！ 必殺技 +50%':'正解：'+current.answer)+'　'+(current.explanation||'');$('quizChoices').querySelectorAll('button').forEach(x=>x.disabled=true);$('quizClose').style.display='inline-block'};$('quizChoices').appendChild(b)});$('quizModal').style.display='flex'};
$('quizClose').onclick=()=>{$('quizModal').style.display='none';paused=false;updateHud()};
$('play').onclick=reset;$('quit').onclick=()=>{if(playing){playing=false;paused=true;$('headline').textContent='バトルを終了しました';$('summary').textContent='いつでも再挑戦できます';stats();$('screen').style.display='flex'}};$('full').onclick=()=>{document.documentElement.requestFullscreen?.().catch(()=>{})};addEventListener('keydown',e=>{if(e.key==='Escape'&&playing)$('quit').click()});stats();
})();
</script></body></html>
